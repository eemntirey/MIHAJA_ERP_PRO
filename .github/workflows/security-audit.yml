name: Security Audit

on:
  push:
    branches: [main, develop, V0]
  pull_request:
    branches: [main, develop, V0]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  pip-audit:
    name: Python Dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit backend dependencies
        run: pip-audit -r web/requirements.txt --desc on

  npm-audit-web:
    name: JS Dependencies — web/frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit
        working-directory: web/frontend
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: web/frontend
      - name: Audit build toolchain (informational)
        run: npm audit --audit-level=high || true
        working-directory: web/frontend

  npm-audit-desk:
    name: JS Dependencies — desk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desk/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit
        working-directory: desk
      - name: Audit application dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: desk
      - name: Audit Electron/build toolchain (informational)
        run: npm audit --audit-level=high || true
        working-directory: desk

  npm-audit-super-admin:
    name: JS Dependencies — super-admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: super-admin/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit
        working-directory: super-admin
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: super-admin
      - name: Audit build toolchain (informational)
        run: npm audit --audit-level=high || true
        working-directory: super-admin

  sast:
    name: SAST — Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bandit
        run: pip install bandit[toml]
      - name: Run Bandit
        run: bandit -r web/backend/app -c web/backend/pyproject.toml || bandit -r web/backend/app -ll
        continue-on-error: true
