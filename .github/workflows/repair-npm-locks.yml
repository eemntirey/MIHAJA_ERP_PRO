name: Temporary NPM lock repair

on:
  push:
    branches: [V0]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[npm-lock-repair]') == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [web/frontend, desk, super-admin]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Repair lockfile without force
        working-directory: ${{ matrix.directory }}
        run: npm audit fix --package-lock-only

      - name: Commit repaired lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes."
            exit 0
          fi
          git add ${{ matrix.directory }}/package-lock.json
          git commit -m "[npm-lock-repair] normalize ${{ matrix.directory }} lockfile"
          git push
