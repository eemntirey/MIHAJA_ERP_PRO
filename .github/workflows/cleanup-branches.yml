name: Cleanup obsolete branches

on:
  push:
    branches:
      - V0

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          keep=("V0" "V0.01" "main")
          current="${GITHUB_REF_NAME}"
          for ref in $(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name'); do
            skip=false
            for k in "${keep[@]}"; do
              if [ "${ref}" = "${k}" ]; then
                skip=true
                break
              fi
            done
            if [ "${skip}" = true ]; then
              echo "KEEP ${ref}"
              continue
            fi
            echo "DELETE ${ref}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${ref}"
          done

      - name: Remove cleanup workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout V0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-branches.yml
          git commit -m "chore(repo): remove temporary branch cleanup workflow"
          git push origin V0
