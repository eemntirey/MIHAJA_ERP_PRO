name: Secret Scan (gitleaks)

on:
  push:
    branches: [V0, main, master]
  pull_request:
    branches: [V0, main, master]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          set -e
          scan_dir="${RUNNER_TEMP}/gitleaks-source"
          mkdir -p "$scan_dir"
          rsync -a --exclude='.git' "${GITHUB_WORKSPACE}/" "$scan_dir/"
          docker run --rm -v "${scan_dir}:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --config=/repo/.gitleaks.toml --redact --no-banner
