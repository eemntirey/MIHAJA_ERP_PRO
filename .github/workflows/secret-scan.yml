name: Secret Scan (gitleaks)

on:
  push:
    branches: [V0, main, master]
  pull_request:
    branches: [V0, main, master]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks@v8
        with:
          config-path: .gitleaks.toml
          fail-on-error: true
