# Blueprint Render — production/staging MIHAJA ERP PRO.
#
# Usage : Render Dashboard → New → Blueprint → choisir le dépôt et la branche V0.01.
# Render détecte ce fichier et crée les ressources définies ci-dessous.
# Guide pas-à-pas : docs/ops/DEPLOIEMENT_RENDER.md (à lire avant).
#
# Architecture (imposée par les cookies JWT SameSite : le web reste same-origin) :
#   erp.sekoliko.com       → frontend statique + réécritures API
#   admin.sekoliko.com     → super-admin statique + réécritures API
#   api.sekoliko.com       → backend Flask + PostgreSQL
# Les réécritures se configurent dans le Dashboard après déploiement.
# Les mobiles (Bearer, pas de cookies) attaquent api.sekoliko.com en direct.

services:
  - type: web
    name: mihaja-erp-pro
    repo: https://github.com/eemntirey/MIHAJA_ERP_PRO
    branch: V0.01
    runtime: docker
    dockerContext: ./web
    dockerfilePath: ./web/backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: MAIL_CONTACT_RECIPIENT
        sync: false
      - key: MAIL_ENABLED
        value: "true"
      - key: MAIL_PROVIDER
        value: "brevo"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: "MIHAJA ERP"
      - key: BREVO_API_URL
        value: https://api.brevo.com/v3/smtp/email
      - key: MAIL_TIMEOUT
        value: "10"
      - key: JWT_COOKIE_CSRF_PROTECT
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://erp.sekoliko.com,https://api.sekoliko.com,https://mihaja-erp-frontend-796e-qdh1.onrender.com,https://mihaja-erp-frontend-796e.onrender.com,https://mihaja-erp-super-admin-796e.onrender.com
      - key: DESKTOP_ELECTRON_CORS
        value: "true"
      - key: JWT_COOKIE_SAMESITE
        value: "None"
      - key: FRONTEND_URL
        value: https://mihaja-erp-frontend-796e-qdh1.onrender.com
      - key: PUBLIC_SITE_URL
        value: https://mihaja-erp-frontend-796e-qdh1.onrender.com
      - key: FRONTEND_RESET_URL
        value: https://mihaja-erp-frontend-796e-qdh1.onrender.com/reset-password
      - key: PAPI_ENVIRONMENT
        value: sandbox

  - type: web
    name: mihaja-erp-frontend
    repo: https://github.com/eemntirey/MIHAJA_ERP_PRO
    branch: V0.01
    runtime: static
    buildCommand: cd web/frontend && npm ci --no-audit --no-fund && npm run build
    staticPublishPath: web/frontend/build
    routes:
      - type: rewrite
        source: /sitemap.xml
        destination: https://mihaja-erp-pro.onrender.com/api/v1/public/sitemap.xml
      - type: rewrite
        source: /api/*
        destination: https://mihaja-erp-pro.onrender.com/api/*
      - type: rewrite
        source: /socket.io/*
        destination: https://mihaja-erp-pro.onrender.com/socket.io/*
      - type: rewrite
        source: /download/desktop
        destination: https://github.com/eemntirey/MIHAJA_ERP_PRO/releases/download/desktop-latest/MIHAJA-ERP-PRO-Setup.exe
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: CI
        value: "false"
      - key: VITE_API_URL
        value: /api/v1
      - key: VITE_SOCKET_URL
        value: https://mihaja-erp-pro.onrender.com
      - key: VITE_PUBLIC_API_URL
        value: /api/v1

  - type: web
    name: mihaja-erp-super-admin
    repo: https://github.com/eemntirey/MIHAJA_ERP_PRO
    branch: V0.01
    runtime: static
    buildCommand: cd super-admin && npm ci --no-audit --no-fund && npm run build
    staticPublishPath: super-admin/build
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; font-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self' https://mihaja-erp-pro.onrender.com wss://mihaja-erp-pro.onrender.com https: wss: http://localhost:5000 http://127.0.0.1:5000 ws://localhost:5000 ws://127.0.0.1:5000;"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /api/*
        destination: https://mihaja-erp-pro.onrender.com/api/*
      - type: rewrite
        source: /socket.io/*
        destination: https://mihaja-erp-pro.onrender.com/socket.io/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: CI
        value: "false"
      - key: VITE_API_URL
        value: /api/v1
      - key: VITE_SOCKET_URL
        value: https://mihaja-erp-pro.onrender.com

# La base PostgreSQL est gérée séparément dans Render.
# Ne pas déclarer une seconde base gratuite dans ce Blueprint.
