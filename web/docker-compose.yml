version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_HOST_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_user} -d ${POSTGRES_DB:-erp_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: erp_redis
    ports:
      - "${REDIS_HOST_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: erp_backend
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - PAPI_API_KEY=${PAPI_API_KEY}
      - PAPI_WEBHOOK_SECRET=${PAPI_WEBHOOK_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
    ports:
      - "${BACKEND_HOST_PORT:-127.0.0.1:5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    # B1 : serveur WSGI de production (gunicorn gthread). 1 worker : voir Dockerfile.
    command: ["gunicorn", "--workers", "1", "--threads", "8", "--worker-class", "gthread",
              "--bind", "0.0.0.0:5000", "--timeout", "120", "--access-logfile", "-",
              "app:create_app()"]

  celery-worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: erp_celery_worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - PAPI_API_KEY=${PAPI_API_KEY}
      - PAPI_WEBHOOK_SECRET=${PAPI_WEBHOOK_SECRET}
      - FLASK_ENV=${FLASK_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/uploads:/app/uploads
    # B3 : `-A app.tasks` résout l'instance Celery créée dans
    # app/tasks/celery_app.py (contexte Flask appliqué à chaque tâche).
    command: celery -A app.tasks worker --loglevel=info
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: erp_celery_beat
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - FLASK_ENV=${FLASK_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # /app/instance existe dans l'image et appartient à l'utilisateur non
      # root `app` : le fichier de planification y est persisté (un
      # redémarrage ne rejoue pas les tâches déjà déclenchées).
      - celerybeat_data:/app/instance
    command: celery -A app.tasks beat --loglevel=info --schedule=/app/instance/celerybeat-schedule
    restart: unless-stopped

  frontend:
    build:
      # B2 : contexte = RACINE du monorepo. Le build CRA importe shared/
      # (alias @shared -> ../../shared, chemins ../../../../shared depuis src/),
      # donc le contexte ./frontend ne suffit pas. Topologie dans l'image :
      # frontend dans /app, shared dans /shared.
      context: ..
      dockerfile: web/frontend/Dockerfile
    container_name: erp_frontend
    # nginx écoute sur 80 dans l'image (remplace le serveur de dev :3000).
    ports:
      - "${FRONTEND_HOST_PORT:-127.0.0.1:3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  celerybeat_data:
