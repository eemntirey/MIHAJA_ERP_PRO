# web/frontend/nginx.conf
# Configuration du frontend (copiée dans /etc/nginx/conf.d/default.conf).
#
# Pourquoi un upstream en VARIABLE ($backend_upstream) et non un nom en dur
# dans proxy_pass : nginx ne résout un nom d'hôte figurant dans proxy_pass
# qu'UNE fois, au chargement de la configuration. Conséquences en production :
#   - si le backend n'est pas encore résoluble, nginx refuse de démarrer
#     ([emerg] host not found in upstream "backend") ;
#   - après un redémarrage du backend (nouvelle IP de conteneur), nginx
#     conserve l'ancienne adresse et renvoie 502 indéfiniment.
# Avec une variable + resolver, la résolution se fait à chaque requête.
#
# `backend:5000` est le nom du service docker-compose (web/docker-compose.yml).
# Pour un déploiement hors compose : monter une conf personnalisée, ou servir
# ce build statique derrière le reverse proxy (cf. carte de mise en production).

# Nécessaire pour l'upgrade WebSocket : "upgrade" uniquement quand le client
# le demande, sinon "close" (le polling socket.io reste sain).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Aligné sur MAX_CONTENT_LENGTH du backend (16 Mo) : import Excel/CSV.
    client_max_body_size 16m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS interne de Docker : permet de re-résoudre le backend à la requête.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $backend_upstream backend:5000;

    # En-têtes de sécurité de base (le TLS/HSTS est posé par le reverse proxy).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Les fichiers produits par CRA sont hachés : cache long et immuable.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API REST.
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Temps réel Socket.IO (polling HTTP + upgrade WebSocket).
    location /socket.io/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Le long-poll peut durer : ne pas couper la connexion.
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # SPA : toute route inconnue est rendue par index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
